name: Build Android APK (ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test]"
          pip install flet

      - name: Run Unit Test Suite
        run: |
          pytest tests/ -v

      - name: Build Android ARM64 APK
        run: |
          # Build APK with USB Host support enabled
          flet build apk --arch arm64

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_PATH=$(find build/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching all directories for built APK..."
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find-apk.outputs.apk_path != ''
        with:
          name: qualcomm-edl-android-arm64
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14
